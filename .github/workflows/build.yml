# FirePower - Fire TV power tool
# Paste this file into your repo at .github/workflows/build.yml
# Every push (or Actions > Run workflow) builds the APK and publishes it to:
#   https://github.com/<you>/<repo>/releases/download/latest/firepower.apk
name: Build FirePower APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write project
        run: |
          mkdir -p firepower && cd firepower
          mkdir -p "$(dirname "app/build.gradle.kts")"
          cat > 'app/build.gradle.kts' << 'FP_EOF_0'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.cf.firepower"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.cf.firepower"
                  minSdk = 22
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                      excludes += "/META-INF/*.md"
                      excludes += "/META-INF/LICENSE*"
                      excludes += "/META-INF/NOTICE*"
                      excludes += "/META-INF/DEPENDENCIES"
                      pickFirsts += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
                  }
              }
          }

          dependencies {
              implementation("dev.mobile:dadb:1.2.7")
          }
          FP_EOF_0
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > 'app/src/main/AndroidManifest.xml' << 'FP_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="FirePower"
                  android:icon="@drawable/icon"
                  android:banner="@drawable/banner"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FP_EOF_1
          mkdir -p "$(dirname "app/src/main/assets/firepower.sh")"
          cat > 'app/src/main/assets/firepower.sh' << 'FP_EOF_2'
          #!/system/bin/sh
          # firepower.sh - Fire TV Stick tune-up
          # Usage (from Remote ADB Shell):
          #   sh /sdcard/Download/firepower.sh status      # overview (read-only)
          #   sh /sdcard/Download/firepower.sh quick       # animations, caches, background apps (no apps disabled)
          #   sh /sdcard/Download/firepower.sh clutter     # list Amazon extras and their state
          #   sh /sdcard/Download/firepower.sh declutter <package>    # turn ONE off
          #   sh /sdcard/Download/firepower.sh undeclutter <package>  # turn ONE back on
          #   sh /sdcard/Download/firepower.sh restore     # undo everything FirePower changed
          #   sh /sdcard/Download/firepower.sh net         # IP, DNS (Pi-hole check), Wi-Fi (read-only)
          #   sh /sdcard/Download/firepower.sh hogs        # top memory users (read-only)
          #   sh /sdcard/Download/firepower.sh diagnose 60 # log every 5s, N samples (read-only)
          #   sh /sdcard/Download/firepower.sh startdiag 120 / stopdiag  # same, in background
          #
          # Safe with an existing update block:
          # - quick never touches apps
          # - declutter only disables apps on the approved list, one at a time, and logs them
          # - undeclutter/restore only re-enable apps this script disabled
          # - OTA/update packages are never touched, only reported in status

          STATE=/sdcard/firepower.state
          DIAG=/sdcard/firepower_diag.csv
          DIAG_SH=/data/local/tmp/firepower_diag.sh

          PKGS="com.amazon.device.crashmanager
          com.amazon.logan
          com.amazon.hedwig
          com.amazon.bueller.photos
          com.amazon.shoptv.firetv.client
          com.amazon.alexamediaplayer.runtime.ftv"

          # Read-only: shown in status so you can confirm your update block is intact
          OTA_WATCH="com.amazon.device.software.ota
          com.amazon.device.software.ota.override
          com.amazon.tv.forcedotaupdater.v2"

          ANIMS="window_animation_scale transition_animation_scale animator_duration_scale"

          has()      { pm list packages "$1" 2>/dev/null | grep -qx "package:$1"; }
          disabled() { pm list packages -d 2>/dev/null | grep -qx "package:$1"; }
          state_of() {
            if ! has "$1"; then echo "not present"
            elif disabled "$1"; then echo "disabled"
            else echo "enabled"; fi
          }
          wifi_line() { dumpsys wifi 2>/dev/null | grep -m1 'mWifiInfo' | sed 's/[TR]x Link speed/xLink/g'; }

          status() {
            echo "== Update block (never changed by this script) =="
            for p in $OTA_WATCH; do echo "$p: $(state_of $p)"; done
            echo "== Storage =="
            df -h /data | tail -1
            echo "== Memory =="
            grep -E 'MemTotal|MemAvailable' /proc/meminfo
            echo "== Animations =="
            for k in $ANIMS; do echo "$k: $(settings get global $k)"; done
            echo "== Clutter packages =="
            for p in $PKGS; do echo "$p: $(state_of $p)"; done
            echo "== Changes logged by this script =="
            [ -f "$STATE" ] && cat "$STATE" || echo "none"
            echo "== Wi-Fi link =="
            wifi_line | tr ',' '\n' | grep -E 'SSID|Link speed|Frequency|RSSI'
          }

          label_of() {
            case "$1" in
              com.amazon.device.crashmanager) echo "Crash reporting" ;;
              com.amazon.logan) echo "Usage logging" ;;
              com.amazon.hedwig) echo "Push notifications" ;;
              com.amazon.bueller.photos) echo "Amazon Photos" ;;
              com.amazon.shoptv.firetv.client) echo "Live Shopping" ;;
              com.amazon.alexamediaplayer.runtime.ftv) echo "Alexa Media Player" ;;
              *) echo "$1" ;;
            esac
          }
          in_list() { echo "$2" | grep -qx "$1"; }
          ours()    { grep -qx "pkg:$1" "$STATE" 2>/dev/null; }

          # 0.5 or faster (including 0 = off) counts as already set
          is_fast() { case "$1" in 0|0.0*|0.[1-4]*|0.5|0.50) return 0 ;; *) return 1 ;; esac; }

          # Zero-risk: never touches any app. Checks each setting before changing it.
          quick() {
            echo "Animations:"
            for k in $ANIMS; do
              v=$(settings get global $k)
              if is_fast "$v"; then
                echo "  $k already $v, left alone"
              else
                grep -q "^anim:$k=" "$STATE" 2>/dev/null || echo "anim:$k=$v" >> "$STATE"
                settings put global $k 0.5
                echo "  $k: $v -> 0.5"
              fi
            done
            echo "Storage before: $(df -h /data | tail -1 | sed 's/  */ /g' | cut -d' ' -f4) free"
            echo "Clearing app caches..."
            pm trim-caches 999G
            echo "Closing background apps..."
            am kill-all
            echo "Storage after:  $(df -h /data | tail -1 | sed 's/  */ /g' | cut -d' ' -f4) free"
            echo "Done. No apps were disabled."
          }

          # Machine-readable list: package|label|enabled/disabled/absent|ours yes/no
          clutter() {
            for p in $PKGS; do
              if ! has "$p"; then st=absent
              elif disabled "$p"; then st=disabled
              else st=enabled; fi
              if ours "$p"; then o=yes; else o=no; fi
              echo "$p|$(label_of "$p")|$st|$o"
            done
          }

          # Turn off ONE app from the approved list
          declutter() {
            p="$1"
            if [ -z "$p" ] || ! in_list "$p" "$PKGS" || in_list "$p" "$OTA_WATCH"; then
              echo "Refused: '$p' is not on the declutter list."
              return 1
            fi
            if ! has "$p"; then echo "Not on this stick: $(label_of "$p")"; return 0; fi
            if disabled "$p"; then echo "Already off, left alone: $(label_of "$p")"; return 0; fi
            if pm disable-user --user 0 "$p" >/dev/null 2>&1 && disabled "$p"; then
              echo "pkg:$p" >> "$STATE"
              echo "Turned off: $(label_of "$p"). Restart the stick and check your apps."
            else
              echo "Blocked by Fire OS: $(label_of "$p")"
            fi
          }

          # Turn ONE app back on, only if FirePower turned it off
          undeclutter() {
            p="$1"
            if [ -z "$p" ] || in_list "$p" "$OTA_WATCH"; then echo "Refused."; return 1; fi
            if ! ours "$p"; then echo "Not changed by FirePower, left alone: $(label_of "$p")"; return 1; fi
            if ! disabled "$p"; then
              grep -vx "pkg:$p" "$STATE" > "$STATE.tmp"; mv "$STATE.tmp" "$STATE"
              echo "Already on, nothing to do: $(label_of "$p")"
              return 0
            fi
            pm enable "$p" >/dev/null 2>&1
            if disabled "$p"; then echo "Could not turn back on: $(label_of "$p")"; return 1; fi
            grep -vx "pkg:$p" "$STATE" > "$STATE.tmp"; mv "$STATE.tmp" "$STATE"
            echo "Turned back on: $(label_of "$p")"
          }

          restore() {
            if [ ! -f "$STATE" ]; then echo "Nothing to restore."; return; fi
            grep '^anim:' "$STATE" | while IFS= read -r line; do
              kv=${line#anim:}; k=${kv%%=*}; v=${kv#*=}
              cur=$(settings get global "$k")
              if [ "$cur" != "0.5" ]; then
                echo "  $k changed since (now $cur), left alone"
              elif [ "$v" = "null" ]; then
                settings delete global "$k" >/dev/null; echo "  $k -> default"
              else
                settings put global "$k" "$v"; echo "  $k -> $v"
              fi
            done
            grep '^pkg:' "$STATE" | while IFS= read -r line; do
              p=${line#pkg:}
              if in_list "$p" "$OTA_WATCH"; then
                echo "  skipped (update package, left alone): $p"
              elif ! has "$p"; then
                echo "  not on this stick any more: $p"
              elif ! disabled "$p"; then
                echo "  already on, nothing to do: $(label_of "$p")"
              else
                pm enable "$p" >/dev/null 2>&1 && echo "  on: $(label_of "$p")"
              fi
            done
            rm -f "$STATE"
            echo "Restored only FirePower's changes. Restart the stick."
          }

          net() {
            echo "== IP address =="
            for i in wlan0 eth0; do
              a=$(ip -4 addr show "$i" 2>/dev/null | grep -o 'inet [0-9.]*')
              [ -n "$a" ] && echo "$i: ${a#inet }"
            done
            echo "== DNS servers (should be your Pi-hole's IP) =="
            dumpsys connectivity 2>/dev/null | grep -o 'DnsAddresses: \[[^]]*\]' | sort -u
            echo "== Private DNS (should be off or null, or Pi-hole is bypassed) =="
            settings get global private_dns_mode
            echo "== Wi-Fi =="
            wifi_line | tr ',' '\n' | grep -E 'SSID|Link speed|Frequency|RSSI'
            echo "(Frequency 5xxx = 5 GHz, 24xx = 2.4 GHz)"
          }

          hogs() {
            echo "== Top memory users =="
            dumpsys meminfo 2>/dev/null | sed -n '/Total PSS by process/,/^$/p' | head -16
          }

          diagnose() {
            n=${1:-60}
            echo "time,rssi_dbm,link_mbps,freq_mhz,mem_avail_kb,data_free_kb" > "$DIAG"
            echo "Logging $n samples, 5s apart, to $DIAG. Start playback now."
            i=0
            while [ "$i" -lt "$n" ]; do
              w=$(wifi_line)
              rssi=$(echo "$w" | sed -n 's/.*RSSI: \([-0-9]*\).*/\1/p')
              link=$(echo "$w" | sed -n 's/.*Link speed: \([0-9]*\).*/\1/p')
              freq=$(echo "$w" | sed -n 's/.*Frequency: \([0-9]*\).*/\1/p')
              mem=$(grep MemAvailable /proc/meminfo | sed 's/[^0-9]//g')
              free=$(df /data | tail -1 | sed 's/  */ /g' | cut -d' ' -f4)
              echo "$(date +%H:%M:%S),$rssi,$link,$freq,$mem,$free" | tee -a "$DIAG"
              i=$((i+1))
              sleep 5
            done
            echo "Done. Note the time of any stutter and compare with the log."
          }

          summary() {
            p=0; d=0
            for x in $OTA_WATCH; do
              if has "$x"; then
                p=$((p+1))
                disabled "$x" && d=$((d+1))
              fi
            done
            echo "ota_present=$p"
            echo "ota_disabled=$d"
            echo "storage_free=$(df -h /data | tail -1 | sed 's/  */ /g' | cut -d' ' -f4)"
            kb=$(grep MemAvailable /proc/meminfo | sed 's/[^0-9]//g')
            echo "mem_avail_mb=$(( ${kb:-0} / 1024 ))"
            w=$(wifi_line)
            echo "link_mbps=$(echo "$w" | sed -n 's/.*Link speed: \([-0-9]*\).*/\1/p')"
            echo "freq_mhz=$(echo "$w" | sed -n 's/.*Frequency: \([-0-9]*\).*/\1/p')"
            echo "rssi_dbm=$(echo "$w" | sed -n 's/.*RSSI: \([-0-9]*\).*/\1/p')"
            echo "anim=$(settings get global window_animation_scale)"
            echo "private_dns=$(settings get global private_dns_mode)"
          }

          stopdiag() {
            pkill -f 'firepower_diag.sh diagnose' && echo "Stopped." || echo "Not running."
          }

          startdiag() {
            if pgrep -f 'firepower_diag.sh diagnose' >/dev/null 2>&1; then
              echo "Already logging. Choose Diagnose results to see it so far."
              return 0
            fi
            rm -f "$DIAG"
            cp "$0" "$DIAG_SH"
            setsid nohup sh "$DIAG_SH" diagnose "${1:-120}" >/dev/null 2>&1 &
            echo "Logging started. Go and watch something."
          }

          case "${1:-status}" in
            status)   status ;;
            quick|boost) quick ;;
            clutter)  clutter ;;
            declutter) declutter "$2" ;;
            undeclutter) undeclutter "$2" ;;
            restore)  restore ;;
            net)      net ;;
            hogs)     hogs ;;
            diagnose) diagnose "$2" ;;
            summary)  summary ;;
            startdiag) startdiag "$2" ;;
            stopdiag) stopdiag ;;
            *) echo "Usage: sh firepower.sh [status|quick|clutter|declutter PKG|undeclutter PKG|restore|net|hogs|diagnose N|startdiag N|stopdiag|summary]" ;;
          esac
          FP_EOF_2
          mkdir -p "$(dirname "app/src/main/java/com/cf/firepower/MainActivity.kt")"
          cat > 'app/src/main/java/com/cf/firepower/MainActivity.kt' << 'FP_EOF_3'
          package com.cf.firepower

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.StateListDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import dadb.AdbKeyPair
          import dadb.Dadb
          import java.io.File
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.TimeoutException

          class MainActivity : Activity() {

              private val io = Executors.newCachedThreadPool()
              private val ui = Handler(Looper.getMainLooper())
              private var busy = false

              private lateinit var console: TextView
              private lateinit var consoleScroll: ScrollView
              private lateinit var badge: TextView
              private val tileValues = HashMap<String, TextView>()
              private val tileSubs = HashMap<String, TextView>()

              private val bgColor = Color.parseColor("#121210")
              private val surface = Color.parseColor("#1C1B18")
              private val textColor = Color.parseColor("#EFECE4")
              private val muted = Color.parseColor("#A09C92")
              private val accent = Color.parseColor("#F2A33A")
              private val dark = Color.parseColor("#1A1206")
              private val green = Color.parseColor("#8FD18F")

              private val remote = "/data/local/tmp/firepower.sh"
              private val diagFile = "/sdcard/firepower_diag.csv"

              private val help = """
                  Can't reach ADB on this stick.
                  1. Settings > My Fire TV > Developer options > ADB debugging: ON
                  2. When the "Allow debugging?" prompt appears, tick "Always allow" and press OK.
                  3. Try again.
              """.trimIndent()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.setBackgroundColor(bgColor)
                  setContentView(buildUi())
                  log("FirePower ready. The first time, accept the \"Allow debugging\" prompt on screen.")
                  refresh()
              }

              override fun onDestroy() {
                  io.shutdownNow()
                  super.onDestroy()
              }

              // ---------- UI ----------

              private fun buildUi(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(32), dp(24), dp(32), dp(24))
                      setBackgroundColor(bgColor)
                  }

                  val left = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(left, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f))

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  header.addView(
                      label("FirePower", 26f, textColor, bold = true),
                      LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  )
                  badge = label("Checking update block…", 13f, muted).apply {
                      setPadding(dp(12), dp(6), dp(12), dp(6))
                      background = rounded(surface, 999)
                  }
                  header.addView(badge)
                  left.addView(header)

                  val tiles = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val tileDefs = listOf(
                      "storage" to "Storage free",
                      "memory" to "Memory free",
                      "wifi" to "Wi-Fi link",
                      "anim" to "Animations"
                  )
                  tileDefs.forEachIndexed { i, (key, title) ->
                      val tile = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(14), dp(10), dp(14), dp(10))
                          background = rounded(surface, 12)
                      }
                      tile.addView(label(title, 12f, muted))
                      val value = label("…", 20f, textColor).apply {
                          typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                      }
                      val sub = label(" ", 11f, muted)
                      tile.addView(value)
                      tile.addView(sub)
                      tileValues[key] = value
                      tileSubs[key] = sub
                      val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      if (i > 0) lp.leftMargin = dp(10)
                      tiles.addView(tile, lp)
                  }
                  left.addView(tiles, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = dp(16) })

                  console = label("", 12f, textColor).apply { typeface = Typeface.MONOSPACE }
                  consoleScroll = ScrollView(this).apply {
                      isFocusable = true
                      background = StateListDrawable().apply {
                          addState(intArrayOf(android.R.attr.state_focused), rounded(surface, 12, 2, accent))
                          addState(intArrayOf(), rounded(surface, 12))
                      }
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      addView(console)
                  }
                  left.addView(consoleScroll, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  ).apply { topMargin = dp(16) })

                  val actions = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val first = action(actions, "Quick boost", "Animations, caches, background apps") { confirmQuick() }
                  action(actions, "Declutter", "Turn off Amazon extras one at a time") { declutterMenu() }
                  action(actions, "Restore", "Undo only FirePower's own changes") { confirmRestore() }
                  action(actions, "Network check", "IP, DNS / Pi-hole, Wi-Fi band") {
                      exec("Network check", "sh $remote net")
                  }
                  action(actions, "Memory hogs", "Apps using the most RAM") {
                      exec("Memory hogs", "sh $remote hogs")
                  }
                  action(actions, "Start diagnose", "Log for 10 minutes while you watch") { confirmDiagnose() }
                  action(actions, "Diagnose results", "Find what caused the buffering") { diagnoseResults() }
                  action(actions, "Refresh status", "Re-read the tiles") { refresh() }

                  val actionScroll = ScrollView(this).apply { addView(actions) }
                  root.addView(actionScroll, LinearLayout.LayoutParams(
                      dp(280), ViewGroup.LayoutParams.MATCH_PARENT
                  ).apply { leftMargin = dp(24) })

                  first.post { first.requestFocus() }
                  return root
              }

              private fun action(parent: LinearLayout, title: String, sub: String, onPick: () -> Unit): View {
                  val focused = intArrayOf(android.R.attr.state_focused)
                  val titleColors = ColorStateList(arrayOf(focused, intArrayOf()), intArrayOf(dark, textColor))
                  val subColors = ColorStateList(arrayOf(focused, intArrayOf()), intArrayOf(dark, muted))
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      isFocusable = true
                      isClickable = true
                      setPadding(dp(16), dp(10), dp(16), dp(10))
                      background = StateListDrawable().apply {
                          addState(focused, rounded(accent, 12, 2, Color.WHITE))
                          addState(intArrayOf(), rounded(surface, 12))
                      }
                      setOnClickListener { onPick() }
                  }
                  box.addView(label(title, 17f, textColor, bold = true).apply {
                      setTextColor(titleColors)
                      isDuplicateParentStateEnabled = true
                  })
                  box.addView(label(sub, 12f, muted).apply {
                      setTextColor(subColors)
                      isDuplicateParentStateEnabled = true
                  })
                  parent.addView(box, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { bottomMargin = dp(8) })
                  return box
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun label(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  val tv = TextView(this)
                  tv.text = s
                  tv.textSize = size
                  tv.setTextColor(color)
                  if (bold) tv.typeface = Typeface.DEFAULT_BOLD
                  return tv
              }

              private fun rounded(color: Int, radius: Int, stroke: Int = 0, strokeColor: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(radius).toFloat()
                  if (stroke > 0) g.setStroke(dp(stroke), strokeColor)
                  return g
              }

              private fun log(s: String) {
                  console.text = (console.text.toString() + "\n" + s).takeLast(12000).trimStart()
                  consoleScroll.post { consoleScroll.scrollTo(0, console.bottom) }
              }

              private fun setBadge(s: String, c: Int) {
                  badge.text = s
                  badge.setTextColor(c)
              }

              private fun confirm(title: String, msg: String, go: () -> Unit) {
                  AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                      .setTitle(title)
                      .setMessage(msg)
                      .setPositiveButton("Go") { _, _ -> go() }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              // ---------- ADB ----------

              private fun keyPair(): AdbKeyPair {
                  val priv = File(filesDir, "adbkey")
                  val pub = File(filesDir, "adbkey.pub")
                  if (!priv.exists() || !pub.exists()) AdbKeyPair.generate(priv, pub)
                  return AdbKeyPair.read(priv, pub)
              }

              private fun adb(cmd: String): String {
                  val local = File(cacheDir, "firepower.sh")
                  assets.open("firepower.sh").use { input ->
                      local.outputStream().use { output -> input.copyTo(output) }
                  }
                  Dadb.create("127.0.0.1", 5555, keyPair()).use { d ->
                      val onStick = d.shell("md5sum $remote 2>/dev/null").output.trim().substringBefore(" ")
                      if (onStick != md5(local)) d.push(local, remote, 493, System.currentTimeMillis())
                      return d.shell(cmd).allOutput.trim()
                  }
              }

              private fun md5(f: File): String =
                  java.security.MessageDigest.getInstance("MD5").digest(f.readBytes())
                      .joinToString("") { "%02x".format(it.toInt() and 0xff) }

              private fun exec(title: String, cmd: String, quiet: Boolean = false, after: ((String) -> Unit)? = null) {
                  if (busy) {
                      Toast.makeText(this, "Still working…", Toast.LENGTH_SHORT).show()
                      return
                  }
                  busy = true
                  if (!quiet) log("\n> $title")
                  io.execute {
                      var ok = true
                      val job = io.submit<String> { adb(cmd) }
                      val out = try {
                          job.get(90, TimeUnit.SECONDS)
                      } catch (e: TimeoutException) {
                          job.cancel(true)
                          ok = false
                          "Timed out. If an \"Allow debugging?\" prompt is showing, accept it and try again."
                      } catch (e: Throwable) {
                          ok = false
                          val cause = e.cause ?: e
                          "Error: " + (cause.message ?: cause.javaClass.simpleName) + "\n" + help
                      }
                      ui.post {
                          busy = false
                          if (!quiet || !ok) log(out)
                          if (ok) after?.invoke(out)
                      }
                  }
              }

              // ---------- Actions ----------

              private fun refresh() {
                  exec("Status", "sh $remote summary", quiet = true) { out ->
                      val m = HashMap<String, String>()
                      for (line in out.lines()) {
                          val i = line.indexOf('=')
                          if (i > 0) m[line.substring(0, i).trim()] = line.substring(i + 1).trim()
                      }

                      tileValues["storage"]?.text = m["storage_free"].orEmpty().ifEmpty { "?" }
                      tileSubs["storage"]?.text = "internal"
                      tileValues["memory"]?.text = (m["mem_avail_mb"] ?: "?") + " MB"
                      tileSubs["memory"]?.text = "available now"

                      val link = m["link_mbps"].orEmpty()
                      val freq = m["freq_mhz"].orEmpty()
                      tileValues["wifi"]?.text = if (link.isEmpty() || link.startsWith("-")) "—" else "$link Mbps"
                      tileSubs["wifi"]?.text = when {
                          freq.startsWith("5") -> "5 GHz"
                          freq.startsWith("2") -> "2.4 GHz"
                          else -> "no Wi-Fi link"
                      }

                      val anim = m["anim"].orEmpty()
                      tileValues["anim"]?.text = if (anim.isEmpty() || anim == "null") "1.0×" else "$anim×"
                      tileSubs["anim"]?.text = when (anim) {
                          "0", "0.0" -> "off"
                          "0.5" -> "fast"
                          "", "null", "1.0", "1" -> "default"
                          else -> "custom"
                      }

                      val present = m["ota_present"]?.toIntOrNull() ?: 0
                      val off = m["ota_disabled"]?.toIntOrNull() ?: 0
                      when {
                          present == 0 -> setBadge("Update packages not found", muted)
                          off == present -> setBadge("Update block intact ($off/$present)", green)
                          else -> setBadge("Update packages: $off/$present disabled", accent)
                      }

                      if (m["private_dns"] == "hostname") {
                          log("Note: Private DNS is on, so this stick bypasses your Pi-hole.")
                      }
                  }
              }

              private fun confirmQuick() = confirm(
                  "Quick boost",
                  "Checks your animation speeds and only speeds up ones that aren't already fast, then clears app caches and closes background apps.\n\n" +
                      "No apps are disabled. Restore only reverts what FirePower changed."
              ) {
                  exec("Quick boost", "sh $remote quick") { refresh() }
              }

              private fun declutterMenu() {
                  exec("Declutter", "sh $remote clutter", quiet = true) { out ->
                      val items = out.lines().map { it.split("|") }.filter { it.size == 4 }
                      if (items.isEmpty()) {
                          log("No declutter apps found on this stick.")
                      } else {
                          val labels = items.map { p ->
                              p[1] + " — " + when {
                                  p[2] == "absent" -> "not on this stick"
                                  p[2] == "enabled" -> "on"
                                  p[3] == "yes" -> "off (FirePower, can undo)"
                                  else -> "off (not FirePower, left alone)"
                              }
                          }.toTypedArray()
                          AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                              .setTitle("Declutter — one at a time")
                              .setItems(labels) { _, which -> pickClutter(items[which]) }
                              .setNegativeButton("Close", null)
                              .show()
                      }
                  }
              }

              private fun pickClutter(p: List<String>) {
                  val pkg = p[0]
                  val name = p[1]
                  when {
                      p[2] == "absent" -> log("$name isn't on this stick.")
                      p[2] == "enabled" -> confirm(
                          "Turn off $name?",
                          "Disables $pkg. It isn't uninstalled, and you can turn it back on from this menu at any time.\n\n" +
                              "Afterwards, restart the stick and check your apps before turning off the next one."
                      ) {
                          exec("Turn off $name", "sh $remote declutter $pkg") { refresh() }
                      }
                      p[3] == "yes" -> confirm("Turn $name back on?", "Re-enables $pkg.") {
                          exec("Turn on $name", "sh $remote undeclutter $pkg") { refresh() }
                      }
                      else -> log("$name was already off before FirePower, so it's left alone.")
                  }
              }

              private fun confirmRestore() = confirm(
                  "Restore",
                  "Turns back on every app FirePower turned off and puts your animation speeds back. Apps you disabled yourself, and your update block, are left alone."
              ) {
                  exec("Restore", "sh $remote restore") { refresh() }
              }

              private fun confirmDiagnose() = confirm(
                  "Start diagnose",
                  "Logs Wi-Fi signal, link speed and free memory every 5 seconds for 10 minutes, in the background.\n\n" +
                      "Open Stremio and play something big. Note the time if it stutters, then come back and choose Diagnose results."
              ) {
                  exec("Start diagnose", "sh $remote startdiag 120")
              }

              private fun diagnoseResults() {
                  exec("Diagnose results", "cat $diagFile 2>/dev/null", quiet = true) { out ->
                      log("\n> Diagnose results\n" + analyse(out))
                  }
              }

              private fun analyse(csv: String): String {
                  val rows = csv.lines()
                      .filter { it.isNotBlank() && !it.startsWith("time") }
                      .map { it.split(",") }
                      .filter { it.size >= 6 }
                  if (rows.isEmpty()) {
                      return "No samples yet. Choose Start diagnose, play something, then check back."
                  }

                  fun num(r: List<String>, i: Int): Int? = r[i].trim().toIntOrNull()

                  val sb = StringBuilder()
                  sb.append(rows.size).append(" samples, ").append(rows.first()[0])
                      .append(" to ").append(rows.last()[0]).append("\n")

                  val rssi = rows.mapNotNull { num(it, 1) }.filter { it in -126..-1 }
                  val link = rows.mapNotNull { num(it, 2) }.filter { it > 0 }
                  val mem = rows.mapNotNull { num(it, 4) }

                  if (rssi.isNotEmpty()) sb.append("Signal: best ${rssi.max()} dBm, worst ${rssi.min()} dBm\n")
                  if (link.isNotEmpty()) sb.append("Link speed: ${link.min()} to ${link.max()} Mbps\n")
                  if (mem.isNotEmpty()) sb.append("Lowest free memory: ${mem.min() / 1024} MB\n")

                  val weak = rows.filter { (num(it, 1) ?: 0) in -126..-71 }.map { it[0] }
                  val slow = rows.filter { (num(it, 2) ?: 0) in 1..149 }.map { it[0] }
                  val lowMem = rows.filter { (num(it, 4) ?: Int.MAX_VALUE) < 150 * 1024 }.map { it[0] }

                  sb.append("\nHints (not proof):\n")
                  if (weak.isNotEmpty()) {
                      sb.append("• Weak signal at ").append(weak.take(6).joinToString())
                          .append(". Try the HDMI extender, or move the stick or router.\n")
                  }
                  if (slow.isNotEmpty()) {
                      sb.append("• Link speed dropped below 150 Mbps at ").append(slow.take(6).joinToString())
                          .append(". Big 4K files need headroom; 5 GHz or Ethernet helps.\n")
                  }
                  if (lowMem.isNotEmpty()) {
                      sb.append("• Memory ran low at ").append(lowMem.take(6).joinToString())
                          .append(". Try Quick boost, or check Memory hogs.\n")
                  }
                  if (weak.isEmpty() && slow.isEmpty() && lowMem.isEmpty()) {
                      sb.append("• Signal, link and memory stayed steady. If it still buffered, the stream source or your internet speed is the likely limit.\n")
                  }
                  return sb.toString()
              }
          }
