          cp firepower/app/build/outputs/apk/debug/app-debug.apk firepower.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest firepower.apk --title "FirePower (latest)" --notes "Build ${{ github.run_number }}"

